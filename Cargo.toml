[package]
name = "hyperschema-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
description = "Rust code generator for npm hyperschema schemas, producing compact-encoding codecs"
keywords = ["hyperschema", "compact-encoding", "codegen", "holepunch"]
categories = ["encoding", "development-tools::build-utils"]

[lib]
name = "hyperschema"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
bytes = "1"
compact-encoding-rs = { path = "../compact-encoding-rs" }
serde_json = "1"
